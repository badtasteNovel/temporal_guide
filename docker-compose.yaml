services:
  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: my-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    networks:
      temporal-network:
        ipv4_address: 172.28.0.4

  # Temporal 專用的 MySQL
  temporal-mysql:
    image: mysql:8.0
    container_name: temporal-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${TEMPORAL_SQL_ROOT_PASSWORD}
      - MYSQL_USER=${TEMPORAL_SQL_USER}
      - MYSQL_PASSWORD=${TEMPORAL_SQL_PD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # 這裡將頂層定義的 config 掛載進去，並命名為 init.sh
    configs:
      - source: mysql_init_script
        target: /docker-entrypoint-initdb.d/init.sh
    networks:
      temporal-network:
        ipv4_address: 172.28.0.2

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: temporal-server
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - MYSQL_USER=${TEMPORAL_SQL_USER}
      - MYSQL_PWD=${TEMPORAL_SQL_PD}
      - MYSQL_SEEDS=temporal-mysql
    depends_on:
      - temporal-mysql
    networks:
      temporal-network:
        ipv4_address: 172.28.0.3

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.21.0
    container_name: temporal-ui
    ports:
      - "8888:8080"
    environment:
      - TEMPORAL_GRPC_ENDPOINT=temporal:7233 
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      temporal-network:
        ipv4_address: 172.28.0.5

# --- 關鍵：定義 Configs 內容 ---
configs:
  mysql_init_script:
    content: |
      #!/bin/bash
      # 使用 heredoc 將帶有變數的 SQL 語法餵給 mysql 指令
      mysql -u root -p"$$MYSQL_ROOT_PASSWORD" <<-EOSQL
        CREATE USER IF NOT EXISTS '$$MYSQL_USER'@'172.28.%.%' IDENTIFIED BY '$$MYSQL_PASSWORD';
        GRANT ALL PRIVILEGES ON temporal.* TO '$$MYSQL_USER'@'172.28.%.%';
        GRANT ALL PRIVILEGES ON temporal_visibility.* TO '$$MYSQL_USER'@'172.28.%.%';
        FLUSH PRIVILEGES;
      EOSQL

networks:
  temporal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  redis_data:
  mysql_data: