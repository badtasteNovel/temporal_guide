services:
  # Redis
  redis:
    image: redis:7.2-alpine
    container_name: my-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    networks:
      temporal-network:
        ipv4_address: 172.28.0.4

  # Temporal 專用的 MySQL
  temporal-mysql:
    image: mysql:8.0
    container_name: temporal-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${TEMPORAL_SQL_ROOT_PASSWORD}
      - MYSQL_USER=${TEMPORAL_SQL_USER}
      - MYSQL_PASSWORD=${TEMPORAL_SQL_PD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      temporal-network:
        ipv4_address: 172.28.0.2  # 固定 MySQL 在 .2

  # Temporal Server
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: temporal-server
    ports:
      - "7233:7233"
    environment:
      - DB=mysql8
      - MYSQL_USER=${TEMPORAL_SQL_USER}
      - MYSQL_PWD=${TEMPORAL_SQL_PD}
      - MYSQL_SEEDS=temporal-mysql
    depends_on:
      - temporal-mysql
    networks:
      temporal-network:
        ipv4_address: 172.28.0.3  # 固定 Temporal 在 .3

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.21.0
    container_name: temporal-ui
    ports:
      - "8888:8080"
    environment:
      # 這裡的 "temporal" 必須是你在 docker-compose 裡面定義 server 的那個 service 名稱
      - TEMPORAL_GRPC_ENDPOINT=temporal:7233 
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      temporal-network:
        ipv4_address: 172.28.0.5

# --- 關鍵：定義固定網段 ---
networks:
  temporal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  redis_data:
  mysql_data: